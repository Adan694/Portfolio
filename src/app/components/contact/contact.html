<section class="contact">
  <h2>Contact Me</h2>

  <form (ngSubmit)="sendEmail($event)">
    <input type="text" placeholder="Your Name" [(ngModel)]="formData.name" name="name" required />

    <input
      type="email"
      placeholder="Your Email"
      [(ngModel)]="formData.email"
      name="email"
      required
    />

    <textarea
      placeholder="Your Message"
      [(ngModel)]="formData.message"
      name="message"
      required
    ></textarea>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Sending...' : 'Send Message' }}
    </button>

    <div *ngIf="submitStatus === 'success'" class="success-message">
      ✅ Message sent successfully! I'll get back to you soon.
    </div>

    <div *ngIf="submitStatus === 'error'" class="error-message">
      ❌ Failed to send message. Please try again.
    </div>
  </form>
</section>
