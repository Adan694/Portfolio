<section class="contact">
  <h2>Contact Me</h2>

  <form #contactForm (ngSubmit)="sendEmail($event)">
    <input
      type="text"
      name="from_name"
      placeholder="Your Name"
      [(ngModel)]="formData.name"
      required
    />

    <input
      type="email"
      name="from_email"
      placeholder="Your Email"
      [(ngModel)]="formData.email"
      required
    />

    <textarea
      name="message"
      placeholder="Your Message"
      [(ngModel)]="formData.message"
      required
    ></textarea>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Sending...' : 'Send Message' }}
    </button>

    <div *ngIf="submitStatus === 'success'" style="color: green; margin-top: 10px">
      ✓ Message sent successfully!
    </div>

    <div *ngIf="submitStatus === 'error'" style="color: red; margin-top: 10px">
      ✗ Failed to send. Please try again.
    </div>
  </form>
</section>
