<section class="projects">
  <h2>My Projects</h2>

  <div class="project-grid">
    <div class="project-card" *ngFor="let project of projects">
      <h3>{{ project.name }}</h3>

      <!-- Tech Stack -->
      <div class="project-links">
        <a [href]="project.github" target="_blank">GitHub</a>

        <!-- Demo button - shows only if demo link exists -->
        <a *ngIf="project.demo" [href]="project.demo" target="_blank" class="demo-btn">Live Demo</a>

        <!-- Message if no demo yet -->
        <span *ngIf="!project.demo" class="no-demo-msg">Demo coming soon</span>
      </div>

      <!-- Description -->
      <p>{{ project.description }}</p>

      <!-- GitHub Button Only -->
      <div class="project-links">
        <a [href]="project.github" target="_blank">GitHub</a>
      </div>
    </div>
  </div>
</section>
